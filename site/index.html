<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="JevRouter is a lightweight decision layer for routing models, tools, and subagents with Jev.">
  <meta name="theme-color" content="#070908">
  <title>JevRouter — Faster Agent Decisions</title>
  <style>
    :root {
      --ink: #fff8fb;
      --muted: #d9b9c8;
      --line: rgba(255, 188, 218, .24);
      --panel: rgba(57, 14, 35, .72);
      --pink: #ff6eb4;
      --soft-pink: #ffc2df;
      --deep: #12070d;
      --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--deep);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    .mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid var(--pink);
      color: var(--pink);
      font-family: var(--mono);
      font-size: 11px;
      transform: rotate(45deg);
    }
    .mark span { transform: rotate(-45deg); }
    .github {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-decoration: none;
      transition: color .2s ease, transform .2s ease;
    }
    .github:hover, .github:focus-visible { color: var(--pink); transform: translateY(-1px); }
    .github svg { width: 18px; height: 18px; fill: currentColor; }
    main { overflow: hidden; }
    .hero {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 80px 0 110px;
      position: relative;
      text-align: center;
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -49%);
      border: 1px solid rgba(216, 255, 98, .14);
      border-radius: 50%;
      border-color: rgba(255, 110, 180, .11);
      box-shadow: 0 0 0 38px rgba(255, 110, 180, .03), 0 0 0 78px rgba(255, 110, 180, .018);
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 13%;
      transform: translateX(-50%);
      width: 1px;
      height: 360px;
      background: linear-gradient(transparent, rgba(255, 110, 180, .55), transparent);
      pointer-events: none;
    }
    h1 {
      width: 100%;
      margin: 0;
      font-size: clamp(20px, 3.65vw, 60px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 500;
      white-space: nowrap;
    }
    h1 .brand { color: var(--pink); }
    h1 em { color: var(--soft-pink); font-style: normal; }
    .install {
      width: min(650px, 100%);
      margin: 46px auto 0;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 22px 80px rgba(0, 0, 0, .26);
      backdrop-filter: blur(16px);
    }
    .install-head {
      height: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 13px 0 15px;
      border-bottom: 1px solid var(--line);
      color: #c08ca5;
      font: 10px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .copy {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: 11px var(--mono);
      padding: 5px 0;
    }
    .copy:hover, .copy:focus-visible { color: var(--pink); }
    pre { margin: 0; padding: 20px 19px 22px; overflow-x: auto; color: var(--ink); font: 13px/1.75 var(--mono); text-align: left; }
    .prompt { color: var(--pink); }
    .string { color: var(--soft-pink); }
    .toast { position: fixed; left: 50%; bottom: 25px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 13px; border: 1px solid var(--lime); background: #11170f; color: var(--lime); font: 11px var(--mono); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 720px) {
      .shell { width: min(100% - 32px, 620px); }
      .topbar { height: 64px; }
      .github span { display: none; }
      .hero { min-height: calc(100vh - 64px); padding: 48px 0 70px; }
      .hero::before { width: 430px; height: 430px; top: 50%; }
      .hero::after { top: 10%; height: 200px; }
      h1 { font-size: clamp(11px, 3.65vw, 42px); letter-spacing: -.06em; }
      .install { margin-top: 34px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="wordmark" href="./" aria-label="JevRouter home"><span class="mark"><span>J</span></span></a>
    <a class="github" href="https://github.com/BillionsBobby/JevRouter" target="_blank" rel="noreferrer" aria-label="Open JevRouter on GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.74.08-.74 1.2.09 1.84 1.23 1.84 1.23 1.07 1.84 2.8 1.31 3.48 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.46 11.46 0 0 1 6.01 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.76.84 1.23 1.91 1.23 3.22 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .7Z"/></svg>
    </a>
  </header>
  <main>
    <section class="shell hero">
      <div>
        <h1><span class="brand">JevRouter,</span> Making Every Agent Decision <em>Faster.</em></h1>
        <div class="install" aria-label="Install and use JevRouter">
          <div class="install-head"><span></span><button class="copy" type="button" data-copy aria-label="Copy code" title="Copy code">⧉</button></div>
          <pre><code><span class="prompt">JEV_API_KEY=...</span> <span class="string">npx jevrouter route --request</span> \
  <span class="string">"route this task to the best capability"</span></code></pre>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite">Copied to clipboard</div>
  <script>
    const button = document.querySelector('[data-copy]');
    const toast = document.querySelector('.toast');
    const code = 'JEV_API_KEY=... npx jevrouter route --request "route this task to the best capability"';
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(code);
        toast.classList.add('show');
        window.setTimeout(() => toast.classList.remove('show'), 1600);
      } catch {
        button.textContent = 'Select code manually';
      }
    });
  </script>
</body>
</html>
